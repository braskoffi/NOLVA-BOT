main{max-width:760px;margin:0 auto;perspective:1200px;perspective-origin:50% 0}
h1{font-size:1.6rem;margin:.2em 0;letter-spacing:-.01em}h2{font-size:1.1rem;margin:0 0 .6em}
.logo{display:flex;align-items:center;gap:14px;font-weight:800;letter-spacing:.32em;color:#fff;text-shadow:0 0 18px rgba(139,92,246,.8)}
.orb{position:relative;width:42px;height:42px;flex:none;perspective:260px}
.orb::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.6),transparent 68%);filter:blur(6px);animation:glow 4s ease-in-out infinite alternate}
.orb img{position:relative;width:100%;height:100%;border-radius:50%;display:block;animation:orb 8s ease-in-out infinite;box-shadow:0 10px 22px -6px rgba(0,0,0,.8)}
.orb.big{width:84px;height:84px;margin:0 0 10px}
@keyframes orb{0%,100%{transform:rotateY(-26deg) rotateX(8deg)}50%{transform:rotateY(26deg) rotateX(-6deg) translateY(-2px)}}
@keyframes glow{to{opacity:.55;transform:scale(1.15)}}
.card{position:relative;margin:14px 0;padding:20px;border-radius:22px;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .7s var(--ease);will-change:transform;animation:rise .8s var(--ease) backwards;animation-delay:calc(var(--i,0)*80ms)}
.card.tilt{transition:transform .14s linear}
.card::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;transform:translateZ(-1px);background:linear-gradient(145deg,rgba(70,36,140,.42),rgba(18,9,42,.62));border:1px solid var(--line);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 30px 60px -24px rgba(0,0,0,.85),0 0 40px -18px rgba(139,92,246,.5)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;transform:translateZ(2px);opacity:0;transition:opacity .5s var(--ease);background:radial-gradient(380px circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.1),transparent 60%)}
.card.tilt::after{opacity:1}
.card>h1,.card>h2{transform:translateZ(28px)}
@keyframes rise{from{opacity:0;transform:translate3d(0,26px,-90px) rotateX(14deg)}}
.mu{color:var(--mu);font-size:.9rem}
.btn{display:inline-block;border:0;border-radius:14px;padding:11px 18px;font:600 1rem inherit;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer;text-decoration:none;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 12px 24px -10px rgba(139,92,246,.9);transition:transform .4s var(--ease),box-shadow .4s var(--ease),background .3s,border-color .3s}
.btn:hover{transform:translateY(-2px) translateZ(0);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 18px 30px -10px rgba(139,92,246,1)}
.btn:active{transform:translateY(1px) scale(.97);transition-duration:.1s}
.btn.s{background:rgba(139,92,246,.08);border:1px solid var(--line);color:var(--tx);box-shadow:none}
.btn.s:hover{background:rgba(139,92,246,.2);border-color:var(--ac)}
.btn.d{background:transparent;border:1px solid var(--bad);color:var(--bad);padding:6px 10px;font-size:.85rem;box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.g{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;margin:8px 0;background:rgba(139,92,246,.06);transition:transform .5s var(--ease),border-color .3s,background .3s,box-shadow .5s var(--ease);animation:rise .7s var(--ease) backwards;animation-delay:calc(var(--j,0)*60ms + 180ms)}
.g:hover{transform:translate3d(0,-3px,18px);border-color:var(--ac);background:rgba(139,92,246,.14);box-shadow:0 18px 30px -16px rgba(0,0,0,.9)}
.g img,.g i{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#4c1d95,#7c3aed);flex:none;font-style:normal;display:grid;place-items:center;font-weight:700;box-shadow:0 6px 14px -4px rgba(0,0,0,.7)}
.g b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.t:last-child{border:0}.t strong{display:block}.t span{color:var(--mu);font-size:.85rem}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:rgba(80,40,150,.5);border:1px solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .4s var(--ease),box-shadow .4s var(--ease)}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:linear-gradient(#fff,#d9c8ff);box-shadow:0 3px 6px rgba(0,0,0,.5);transition:transform .5s var(--spring)}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--ac),var(--pk));box-shadow:0 0 18px -2px rgba(139,92,246,.8)}
input[type=checkbox]:checked::after{transform:translateX(20px)}
input[type=checkbox]:active::after{width:27px}
input[type=checkbox]:checked:active::after{transform:translateX(15px)}
label.f{display:block;margin:12px 0 4px;color:var(--mu);font-size:.9rem}
select,input[type=number],input[type=text],textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:rgba(20,8,44,.7);color:var(--tx);font:inherit;transition:border-color .3s,box-shadow .4s var(--ease)}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
textarea{min-height:90px;resize:vertical}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.err{border-color:var(--bad);color:#ffb3b3}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,30px) scale(.96);background:rgba(50,18,96,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);padding:11px 18px;border-radius:14px;opacity:0;transition:opacity .35s var(--ease),transform .5s var(--spring);pointer-events:none;max-width:90%;box-shadow:0 20px 40px -12px rgba(0,0,0,.8)}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.rule{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);animation:rise .6s var(--ease) backwards;animation-delay:calc(var(--j,0)*50ms)}
:focus-visible{outline:2px solid var(--pk);outline-offset:3px}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(page){animation:vto .25s var(--ease) both}
::view-transition-new(page){animation:vti .45s var(--ease) both}
@keyframes vto{to{opacity:0;transform:scale(.97)}}
@keyframes vti{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:520px){.nums{grid-template-columns:1fr}}
</style>

function blob(px,py,rad,col,a){var q=g.createRadialGradient(px,py,0,px,py,rad);q.addColorStop(0,'rgba('+col+','+a+')');q.addColorStop(1,'rgba('+col+',0)');g.fillStyle=q;g.fillRect(px-rad,py-rad,rad*2,rad*2)}
blob(0,0,R,'70,28,150',.22);
blob(0,0,R*.55,'130,80,235',.3);
blob(0,0,R*.26,'200,160,255',.5);
blob(0,0,R*.1,'250,240,255',.9);
for(i=0;i<70;i++){var t=Math.pow(r(),.8),a=t*4.2+(i%2)*P+gs()*.3,d=R*.92*t;
blob(Math.cos(a)*d,Math.sin(a)*d,R*(.06+r()*.1),r()<.3?'190,120,255':'110,60,220',.05+r()*.05)}
for(i=0;i<3600;i++){var u=Math.pow(r(),.72),rr=R*.95*u,th=u*4.2+(i%2)*P+gs()*.42*(1-u*.45),
px=Math.cos(th)*rr+gs()*R*.014,py=Math.sin(th)*rr+gs()*R*.014,
cr=Math.round(235-u*105),cg=Math.round(215-u*135),cb=Math.round(255-u*35);
g.fillStyle='rgba('+cr+','+cg+','+cb+','+(.18+r()*.6)+')';
var s=.45+r()*1.3*(1-u*.4);g.beginPath();g.arc(px,py,s,0,6.283);g.fill()}
for(i=0;i<500;i++){var a2=r()*6.283,d2=R*Math.pow(r(),.6)*.45;
g.fillStyle='rgba(255,240,255,'+(.2+r()*.5)+')';g.beginPath();g.arc(Math.cos(a2)*d2,Math.sin(a2)*d2,.4+r()*.9,0,6.283);g.fill()}
}
function draw(){
x.setTransform(DPR,0,0,DPR,0,0);x.clearRect(0,0,W,H);
x.save();x.translate(W*(W<700?.62:.74),H*(W<700?.26:.33));x.rotate(-.5);x.scale(1,.5);x.rotate(ang);
x.globalAlpha=.92;x.drawImage(G,-R,-R,2*R,2*R);x.restore()}
function loop(t){var dt=Math.min(.05,(t-last)/1000||0);last=t;ang+=dt*.025;draw();requestAnimationFrame(loop)}
build();
if(rm)draw();else requestAnimationFrame(loop);
addEventListener('resize',function(){build();if(rm)draw()});
})();
</script>
